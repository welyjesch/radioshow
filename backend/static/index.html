<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Concatenator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
        h1 { margin-bottom: 20px; }
        
        .sequence-group { 
            margin-bottom: 16px; 
            background: #16213e; 
            border-radius: 8px; 
            padding: 16px; 
        }
        
        .sequence-header { 
            font-size: 16px; 
            font-weight: bold; 
            margin-bottom: 12px; 
            color: #e94560; 
        }
        
        .sequence-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .file-options {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .file-option {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .file-option input[type="radio"] {
            cursor: pointer;
        }
        
        .file-option label {
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .play-btn {
            padding: 4px 8px;
            background: #0f9896;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 2px;
        }
        
        .play-btn:hover {
            background: #0d7a77;
        }
        
        .silence-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #0f3460;
        }
        
        .silence-checkbox {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .silence-input {
            width: 60px;
            padding: 4px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
        }
        
        .sfx-clip-container {
            margin-top: 8px;
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #0f3460;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
        }
        
        .time-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 12px;
        }
        
        .time-inputs input {
            width: 50px;
            padding: 2px 4px;
            background: #1a1a2e;
            color: white;
            border: 1px solid #444;
            border-radius: 3px;
        }
        
        .controls {
            margin-top: 16px;
            padding: 16px;
            background: #16213e;
            border-radius: 8px;
        }
        
        .controls button {
            padding: 10px 24px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .controls button:hover {
            background: #d63d56;
        }
        
        .controls button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .output-section {
            margin-top: 20px;
            padding: 16px;
            background: #16213e;
            border-radius: 8px;
        }
        
        .output-section audio {
            width: 100%;
            margin-top: 12px;
        }
        
        .error {
            color: #ff6b6b;
            margin-top: 12px;
        }
        
        .loading {
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🎙️ Audio Concatenator</h1>
    <div id="app">
        <p class="loading">Loading audio files...</p>
    </div>

    <audio id="previewPlayer"></audio>

    <script>
        const API_BASE = '';
        let selectedBySequence = {};
        let filesBySequence = {};

        async function loadFiles() {
            try {
                const res = await fetch(`${API_BASE}/api/files`);
                const data = await res.json();
                filesBySequence = {};
                data.forEach(seq => {
                    filesBySequence[seq.sequence] = seq.files;
                });
                renderFiles(data);
            } catch (e) {
                document.getElementById('app').innerHTML = `<p class="error">Error loading files: ${e.message}</p>`;
            }
        }

        function extractLabel(filename) {
            const match = filename.match(/^(\d+)-(\d+)/);
            if (match) {
                return `${match[1]}-${match[2]}`;
            }
            return filename;
        }

        function renderFiles(filesBySeq) {
            if (!filesBySeq.length) {
                document.getElementById('app').innerHTML = '<p>No audio files found in generated_audio/</p>';
                return;
            }

            let html = '';
            filesBySeq.forEach(seq => {
                html += `<div class="sequence-group" data-seq="${seq.sequence}">
                    <div class="sequence-header">Sequence ${seq.sequence}</div>
                    <div class="sequence-row">
                        <div class="file-options">`;
                
                seq.files.forEach((f, idx) => {
                    const shortLabel = extractLabel(f.filename);
                    const radioId = `seq${seq.sequence}_opt${idx}`;
                    const isSfx = f.filename.toLowerCase().includes('sfx');
                    
                    html += `<div class="file-option" style="width: 100%; margin-bottom: 8px;">
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <input type="radio" 
                                   name="seq${seq.sequence}" 
                                   id="${radioId}" 
                                   value="${f.filename}"
                                   data-seq="${seq.sequence}"
                                   data-filename="${f.filename}">
                            <label for="${radioId}">${shortLabel}</label>
                            <button type="button" class="play-btn" data-seq="${seq.sequence}" data-filename="${f.filename}">▶</button>
                            <span class="runtime-display" data-filename="${f.filename}" style="font-size: 11px; margin-left: 5px; color: #aaa;">0.00 / ${f.duration.toFixed(2)}</span>
                            ${isSfx ? `
                                <div class="file-option" style="margin-left: 15px;">
                                    <input type="checkbox" 
                                           id="extract_${seq.sequence}_${idx}" 
                                           class="extract-toggle" 
                                           data-seq="${seq.sequence}" 
                                           data-filename="${f.filename}">
                                    <label for="extract_${seq.sequence}_${idx}">Extract Part</label>
                                </div>
                            ` : ''}
                        </div>
                        ${isSfx ? `
                        <div class="sfx-clip-container" id="clip_container_${seq.sequence}_${idx}" data-seq="${seq.sequence}" data-filename="${f.filename}">
                            <div class="time-inputs">
                                Start: <input type="text" class="start-time" value="0.0">
                                End: <input type="text" class="end-time" value="${f.duration.toFixed(2)}">
                            </div>
                        </div>
                        ` : ''}
                    </div>`;
                });
                
                html += `</div>
                        </div>
                        <div class="silence-section">
                            <div class="silence-checkbox">
                                <input type="checkbox" 
                                       id="silence_${seq.sequence}" 
                                       data-seq="${seq.sequence}"
                                       class="silence-toggle">
                                <label for="silence_${seq.sequence}">+ silence (sec):</label>
                                <input type="number" 
                                       id="silence_val_${seq.sequence}" 
                                       class="silence-input"
                                       data-seq="${seq.sequence}"
                                       value="0.5" 
                                       min="0" 
                                       max="10" 
                                       step="0.1"
                                       disabled>
                            </div>
                        </div>
                    </div>`;
            });

            html += `<div class="controls">
                <button id="concatBtn">Concatenate Selected</button>
            </div>
            
            <div class="output-section" id="output" style="display:none">
                <h3>Output:</h3>
                <audio id="outputPlayer" controls></audio>
                <p id="outputName"></p>
            </div>`;

            document.getElementById('app').innerHTML = html;
            attachEventListeners();
        }

        function attachEventListeners() {
            // Radio button selection
            document.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const seq = parseInt(e.target.dataset.seq);
                    const filename = e.target.dataset.filename;
                    selectedBySequence[seq] = filename;
                });
            });

            // Play buttons
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const filename = btn.dataset.filename;
                    togglePlay(btn, filename);
                });
            });

            // Silence checkboxes
            document.querySelectorAll('.silence-toggle').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const seq = parseInt(e.target.dataset.seq);
                    const input = document.getElementById(`silence_val_${seq}`);
                    input.disabled = !e.target.checked;
                });
            });

            // Extract Part checkboxes
            document.querySelectorAll('.extract-toggle').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const seq = e.target.dataset.seq;
                    const filename = e.target.dataset.filename;
                    const container = document.getElementById(`clip_container_${seq}_${e.target.id.split('_').pop()}`);
                    if (container) {
                        container.style.display = e.target.checked ? 'flex' : 'none';
                    }
                });
            });

            // SFX Time Text Inputs
            document.querySelectorAll('.start-time, .end-time').forEach(input => {
                input.addEventListener('change', (e) => {
                    // No longer updating sliders
                });
            });

            // Concatenate button
            document.getElementById('concatBtn').addEventListener('click', concatenate);
        }

        function togglePlay(btn, filename) {
            const player = document.getElementById('previewPlayer');
            
            if (player.src && player.src.includes(encodeURIComponent(filename)) && !player.paused) {
                player.pause();
                btn.textContent = '▶';
            } else {
                const url = `${API_BASE}/api/audio/${encodeURIComponent(filename)}`;
                player.src = url;
                player.play().catch(err => console.error('Failed to play:', err));
                btn.textContent = '⏸';
                
                // Reset other play buttons to play state
                document.querySelectorAll('.play-btn').forEach(b => {
                    if (b !== btn) b.textContent = '▶';
                });
            }
        }

        // Update runtime display
        setInterval(() => {
            const player = document.getElementById('previewPlayer');
            if (!player.paused) {
                const filename = player.src.split('/audio/')[1];
                if (filename) {
                    const display = document.querySelector(`.runtime-display[data-filename="${decodeURIComponent(filename)}"]`);
                    if (display) {
                        const current = player.currentTime.toFixed(2);
                        const duration = player.duration.toFixed(2);
                        display.textContent = `${current} / ${duration}`;
                    }
                }
            }
        }, 100);

        function playPreview(filename) {
            // Deprecated in favor of togglePlay
        }

        async function concatenate() {
            const sequences = Object.keys(filesBySequence).map(Number).sort((a, b) => a - b);
            const unselected = sequences.filter(seq => !selectedBySequence[seq]);
            
            if (unselected.length > 0) {
                alert(`Please select audio for sequence(s): ${unselected.join(', ')}`);
                return;
            }

            const btn = document.getElementById('concatBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const list = [];
            
            sequences.forEach(seq => {
                const filename = selectedBySequence[seq];
                const isSfx = filename.toLowerCase().includes('sfx');
                
                if (isSfx) {
                    const extractCheckbox = document.querySelector(`.extract-toggle[data-seq="${seq}"][data-filename="${filename}"]`);
                    if (extractCheckbox && extractCheckbox.checked) {
                        const container = document.getElementById(`clip_container_${seq}_${extractCheckbox.id.split('_').pop()}`);
                        const start = container.querySelector('.start-time').value;
                        const end = container.querySelector('.end-time').value;
                        list.push({
                            filename: filename,
                            start_time: parseFloat(start),
                            end_time: parseFloat(end)
                        });
                    } else {
                        list.push(filename);
                    }
                } else {
                    list.push(filename);
                }
                
                const checkbox = document.getElementById(`silence_${seq}`);
                if (checkbox && checkbox.checked) {
                    const input = document.getElementById(`silence_val_${seq}`);
                    const silenceSeconds = parseFloat(input.value);
                    if (!isNaN(silenceSeconds) && silenceSeconds > 0) {
                        list.push({ add_silence: silenceSeconds });
                    }
                }
            });

            try {
                const res = await fetch(`${API_BASE}/api/concatenate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ list })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    const player = document.getElementById('outputPlayer');
                    const audioUrl = `${API_BASE}/api/audio/${encodeURIComponent(data.filename)}`;
                    player.src = audioUrl;
                    document.getElementById('outputName').textContent = data.filename;
                    document.getElementById('output').style.display = 'block';
                    player.play().catch(err => console.error('Failed to play output:', err));
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Concatenate Selected';
            }
        }

        loadFiles();
    </script>
</body>
</html>
